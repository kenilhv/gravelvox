name: Latest dependencies

# uv.lock pins what CI installs, but people who install the package with pip get the newest
# release of every dependency. Once a week, resolve everything to its newest release and run
# the tests, so a breaking upstream release (as PyAV 19 was for faster-whisper 1.2.1) shows
# up here first.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Resolve the newest release of every dependency
        run: uv lock --upgrade
      - name: Install
        run: uv sync --all-groups
      - name: Test
        run: uv run pytest
