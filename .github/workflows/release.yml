name: Release

# Publishes gravelvox-engine to PyPI when a tag such as gravelvox-engine-v0.1.0 is pushed.
# PyPI trusts this workflow through trusted publishing (OpenID Connect), so no API token is
# stored anywhere. Running the workflow by hand runs every check but never publishes.
# See docs/releasing.md.

on:
  push:
    tags:
      - "gravelvox-engine-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI on this commit
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml # this repository at the commit being released

  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known # newest uv whose checksum ships in this pinned action
          enable-cache: false
      - name: Check that the tag matches the version and points at main
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('packages/engine/pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "gravelvox-engine-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in packages/engine/pyproject.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main"
            exit 1
          fi
      - name: Check that the package README is ready to be the PyPI project page
        run: |
          readme=packages/engine/README.md
          problem=""
          if grep -q -i -E "not (yet )?(published )?on PyPI" "$readme"; then
            problem="it says the package is not on PyPI"
          fi
          if ! grep -q "pip install gravelvox-engine" "$readme"; then
            problem="${problem:+$problem; }it has no 'pip install gravelvox-engine' line"
          fi
          if [ -n "$problem" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error file=$readme::$readme becomes the PyPI project page, which cannot be edited after upload: $problem"
              exit 1
            fi
            echo "::warning file=$readme::Update $readme before tagging, because it becomes the PyPI project page: $problem"
          fi
      - name: Build the source distribution and the wheel
        # The build backend is hash-pinned, so no newly released package can end up in the files.
        run: uv build --package gravelvox-engine --out-dir dist --build-constraints .github/build-constraints.txt --require-hashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  check:
    name: Check the distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
          enable-cache: false
      # A copy of the uploaded files. Nothing here can change what the publish job uploads.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - name: Check the metadata
        run: uvx twine==7.0.0 check --strict dist/*
      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl scripts/smoke_dist.py
      - name: Smoke-test the source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/smoke_dist.py

  publish:
    name: Publish to PyPI
    needs: [ci, build, check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gravelvox-engine-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gravelvox-engine/
    permissions:
      id-token: write # lets PyPI verify this workflow run; nothing else is granted
    steps:
      # Exactly the files the build job uploaded: an artifact ID cannot be reused or replaced.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
